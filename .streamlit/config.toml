[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
linkColor = "#2a78d6"
borderColor = "#e1e0d9"
dataframeBorderColor = "#e1e0d9"
showWidgetBorder = true
baseRadius = "0.5rem"
baseFontSize = 15
font = "sans-serif"
headingFont = "sans-serif"

[theme.sidebar]
backgroundColor = "#f9f9f7"

[server]
headless = true

[browser]
gatherUsageStats = false
